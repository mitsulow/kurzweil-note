<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic UI, sans-serif" font-size="15">
<rect width="800" height="440" rx="14" fill="#fbf8f2"/>
<text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#2b2b2b">スケーリング法則: 計算を 10 倍にすると、誤りがきれいに減る</text>
<defs><marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<!-- axes -->
<line x1="90" y1="340" x2="560" y2="340" stroke="#555" stroke-width="2" marker-end="url(#f)"/>
<line x1="90" y1="340" x2="90" y2="70" stroke="#555" stroke-width="2" marker-end="url(#f)"/>
<text x="330" y="375" text-anchor="middle" font-size="14" fill="#555">計算量（GPU × 時間）　← 10 倍ごとに 1 目盛り</text>
<text x="40" y="200" text-anchor="middle" font-size="14" fill="#555" transform="rotate(-90 40 200)">予測の誤り（小さいほど賢い）</text>
<g font-size="12" fill="#9a9a9a" text-anchor="middle">
  <text x="150" y="358">2019</text><text x="250" y="358">2020</text><text x="350" y="358">2022</text><text x="450" y="358">2024</text><text x="530" y="358">2026</text>
</g>
<g stroke="#e0d8c8" stroke-width="1"><line x1="150" y1="340" x2="150" y2="80"/><line x1="250" y1="340" x2="250" y2="80"/><line x1="350" y1="340" x2="350" y2="80"/><line x1="450" y1="340" x2="450" y2="80"/></g>
<!-- line -->
<line x1="110" y1="110" x2="540" y2="290" stroke="#b85c2a" stroke-width="4" stroke-linecap="round"/>
<g fill="#b85c2a">
  <circle cx="150" cy="127" r="7"/><circle cx="250" cy="169" r="7"/><circle cx="350" cy="211" r="7"/><circle cx="450" cy="252" r="7"/><circle cx="530" cy="286" r="7"/>
</g>
<g font-size="12" fill="#2b2b2b">
  <text x="160" y="118">GPT-2</text><text x="260" y="160">GPT-3</text><text x="360" y="202">ChatGPT</text><text x="460" y="243">GPT-4 / Claude 3</text><text x="470" y="300">Opus 4.6 / GPT-5</text>
</g>
<text x="330" y="100" text-anchor="middle" font-size="13" fill="#b85c2a" font-weight="700">両対数グラフで直線 = 「べき乗則」。だから先が予測できる</text>
<!-- emergence markers -->
<g stroke="#3b6ea5" stroke-width="2" stroke-dasharray="4 4"><line x1="350" y1="211" x2="350" y2="150"/><line x1="450" y1="252" x2="450" y2="150"/></g>
<rect x="300" y="125" width="100" height="24" rx="6" fill="#3b6ea5"/><text x="350" y="142" text-anchor="middle" fill="#fff" font-size="12">創発: 算数・翻訳</text>
<rect x="400" y="125" width="110" height="24" rx="6" fill="#3b6ea5"/><text x="455" y="142" text-anchor="middle" fill="#fff" font-size="12">創発: Jスペース?</text>
<!-- right panel -->
<rect x="590" y="80" width="190" height="260" rx="10" fill="#fff" stroke="#e0d8c8"/>
<text x="685" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2b2b">3 つの軸</text>
<g font-size="13" fill="#2b2b2b">
  <text x="605" y="140">① パラメーター</text><text x="615" y="158" fill="#555" font-size="12">15 億 → 1 兆超</text>
  <text x="605" y="190">② データ</text><text x="615" y="208" fill="#555" font-size="12">40GB → ネットの大半</text>
  <text x="605" y="240">③ 計算</text><text x="615" y="258" fill="#555" font-size="12">数十 GPU → 数十万 GPU</text>
  <text x="605" y="300" fill="#b85c2a" font-size="12" font-weight="700">カーツワイル 1999:</text><text x="605" y="318" fill="#b85c2a" font-size="12">「量が質に変わる」</text>
</g>
<text x="400" y="420" text-anchor="middle" font-size="12" fill="#9a9a9a">Kaplan et al. 2020 / Hoffmann et al. (Chinchilla) 2022　／　直線がいつまで続くかは誰も知らない。これが業界最大の賭け</text>
</svg>
