<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic UI, sans-serif" font-size="15">
<rect width="800" height="440" rx="14" fill="#fbf8f2"/>
<text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#2b2b2b">深層学習 = 層を深く積むと「階層」ができる</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9a9a9a"/></marker></defs>
<!-- columns -->
<g text-anchor="middle" font-weight="700" fill="#b85c2a" font-size="15">
  <text x="90" y="80">入力</text><text x="250" y="80">第1層</text><text x="410" y="80">第2層</text><text x="570" y="80">第3層</text><text x="720" y="80">出力</text>
</g>
<g text-anchor="middle" fill="#555" font-size="13">
  <text x="90" y="100">画素（点の明るさ）</text><text x="250" y="100">線・点・角</text><text x="410" y="100">目・鼻・口</text><text x="570" y="100">顔の形</text><text x="720" y="100">判定</text>
</g>
<!-- input grid -->
<g fill="#cfc7b8">
  <rect x="60" y="130" width="14" height="14"/><rect x="76" y="130" width="14" height="14" fill="#7a7466"/><rect x="92" y="130" width="14" height="14"/><rect x="108" y="130" width="14" height="14" fill="#7a7466"/>
  <rect x="60" y="146" width="14" height="14" fill="#7a7466"/><rect x="76" y="146" width="14" height="14"/><rect x="92" y="146" width="14" height="14"/><rect x="108" y="146" width="14" height="14" fill="#7a7466"/>
  <rect x="60" y="162" width="14" height="14"/><rect x="76" y="162" width="14" height="14" fill="#7a7466"/><rect x="92" y="162" width="14" height="14" fill="#7a7466"/><rect x="108" y="162" width="14" height="14"/>
  <rect x="60" y="178" width="14" height="14" fill="#7a7466"/><rect x="76" y="178" width="14" height="14"/><rect x="92" y="178" width="14" height="14"/><rect x="108" y="178" width="14" height="14" fill="#7a7466"/>
</g>
<!-- layer 1: lines -->
<g stroke="#3b6ea5" stroke-width="3" fill="none">
  <circle cx="250" cy="140" r="22" fill="#fff"/><line x1="238" y1="140" x2="262" y2="140"/>
  <circle cx="250" cy="200" r="22" fill="#fff"/><line x1="250" y1="188" x2="250" y2="212"/>
  <circle cx="250" cy="260" r="22" fill="#fff"/><line x1="240" y1="270" x2="260" y2="250"/>
  <circle cx="250" cy="320" r="22" fill="#fff"/><path d="M240 320 Q250 308 260 320"/>
</g>
<!-- layer 2: parts -->
<g stroke="#3b6ea5" stroke-width="3" fill="none">
  <circle cx="410" cy="160" r="26" fill="#fff"/><ellipse cx="410" cy="160" rx="12" ry="7"/><circle cx="410" cy="160" r="3" fill="#3b6ea5"/>
  <circle cx="410" cy="230" r="26" fill="#fff"/><path d="M405 220 L410 240 L417 236"/>
  <circle cx="410" cy="300" r="26" fill="#fff"/><path d="M398 300 Q410 312 422 300"/>
</g>
<!-- layer 3: face -->
<g stroke="#3b6ea5" stroke-width="3" fill="none">
  <circle cx="570" cy="230" r="40" fill="#fff"/>
  <circle cx="558" cy="222" r="3" fill="#3b6ea5"/><circle cx="582" cy="222" r="3" fill="#3b6ea5"/>
  <path d="M567 228 L570 240 L574 238"/><path d="M556 248 Q570 258 584 248"/>
</g>
<!-- output -->
<rect x="670" y="205" width="100" height="50" rx="8" fill="#4a8a5c"/>
<text x="720" y="236" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">「人の顔」</text>
<!-- arrows -->
<g stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#a)">
  <line x1="130" y1="160" x2="222" y2="145"/><line x1="130" y1="165" x2="222" y2="200"/><line x1="130" y1="170" x2="222" y2="258"/><line x1="130" y1="175" x2="222" y2="318"/>
  <line x1="275" y1="145" x2="380" y2="160"/><line x1="275" y1="200" x2="380" y2="165"/><line x1="275" y1="260" x2="380" y2="230"/><line x1="275" y1="320" x2="380" y2="300"/><line x1="275" y1="205" x2="380" y2="295"/>
  <line x1="440" y1="165" x2="530" y2="220"/><line x1="440" y1="230" x2="528" y2="230"/><line x1="440" y1="300" x2="530" y2="240"/>
  <line x1="612" y1="230" x2="668" y2="230"/>
</g>
<text x="400" y="385" text-anchor="middle" font-size="13" fill="#555">下の層は「部品」、上の層は「部品の組み合わせ」。社長は現場の点を見ず、部長の報告だけで判断する</text>
<text x="400" y="412" text-anchor="middle" font-size="13" fill="#9a9a9a">カーツワイルの「新皮質 3 億のパターン認識器の階層」と同じ形　／　2012 AlexNet 8 層 → 今は 100 層前後</text>
</svg>
