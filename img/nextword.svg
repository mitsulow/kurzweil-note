<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic UI, sans-serif" font-size="15">
<rect width="800" height="420" rx="14" fill="#fbf8f2"/>
<text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#2b2b2b">「次の単語」は 1 つに決めない。全部に確率をつけて、くじを引く</text>
<!-- left: plain -->
<text x="200" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#3b6ea5">「家でケーキを ___」</text>
<g font-size="14" fill="#2b2b2b">
  <text x="60" y="125">作る</text><rect x="120" y="112" width="152" height="18" rx="4" fill="#3b6ea5"/><text x="280" y="126" font-size="13">38%</text>
  <text x="60" y="160">食べる</text><rect x="120" y="147" width="120" height="18" rx="4" fill="#3b6ea5" opacity="0.8"/><text x="248" y="161" font-size="13">30%</text>
  <text x="60" y="195">焼く</text><rect x="120" y="182" width="60" height="18" rx="4" fill="#3b6ea5" opacity="0.6"/><text x="188" y="196" font-size="13">15%</text>
  <text x="60" y="230">買う</text><rect x="120" y="217" width="16" height="18" rx="4" fill="#3b6ea5" opacity="0.5"/><text x="144" y="231" font-size="13">4%</text>
  <text x="60" y="265">飾る</text><rect x="120" y="252" width="8" height="18" rx="4" fill="#3b6ea5" opacity="0.5"/><text x="136" y="266" font-size="13">2%</text>
  <text x="60" y="300">月</text><rect x="120" y="287" width="1" height="18" fill="#3b6ea5"/><text x="130" y="301" font-size="13">0.0001%</text>
</g>
<text x="200" y="340" text-anchor="middle" font-size="13" fill="#555">「作る」も「食べる」も生きている。引くたびに変わる</text>
<!-- right: with context -->
<text x="600" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#b85c2a">「オーブンを予熱して、家でケーキを ___」</text>
<g font-size="14" fill="#2b2b2b">
  <text x="460" y="125">焼く</text><rect x="520" y="112" width="200" height="18" rx="4" fill="#b85c2a"/><text x="728" y="126" font-size="13">50%</text>
  <text x="460" y="160">作る</text><rect x="520" y="147" width="168" height="18" rx="4" fill="#b85c2a" opacity="0.8"/><text x="696" y="161" font-size="13">42%</text>
  <text x="460" y="195">食べる</text><rect x="520" y="182" width="12" height="18" rx="4" fill="#b85c2a" opacity="0.5"/><text x="540" y="196" font-size="13">3%</text>
  <text x="460" y="230">買う</text><rect x="520" y="217" width="2" height="18" rx="4" fill="#b85c2a" opacity="0.5"/><text x="530" y="231" font-size="13">0.5%</text>
</g>
<text x="600" y="300" text-anchor="middle" font-size="13" fill="#b85c2a" font-weight="700">5 語前の「オーブン」が、確率を動かした</text>
<text x="600" y="340" text-anchor="middle" font-size="13" fill="#555">これが「全部の単語が全部を見る」（アテンション）の効き目</text>
<line x1="400" y1="95" x2="400" y2="350" stroke="#e0d8c8"/>
<text x="400" y="395" text-anchor="middle" font-size="13" fill="#9a9a9a">「温度」設定: 低い = 1 位ばかり引く（堅い）　高い = 下位も引く（ばらける・創造的）　／　数字は説明用の例</text>
</svg>
