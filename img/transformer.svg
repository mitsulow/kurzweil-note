<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic UI, sans-serif" font-size="15">
<rect width="800" height="460" rx="14" fill="#fbf8f2"/>
<text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#2b2b2b">トランスフォーマー = 「全部の単語が、全部の単語を見る」</text>
<defs><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85c2a"/></marker></defs>
<!-- RNN -->
<text x="40" y="80" font-size="16" font-weight="700" fill="#b85c2a">昔（RNN）: 伝言ゲーム。左から右へ 1 語ずつ</text>
<g font-size="14" fill="#2b2b2b" text-anchor="middle">
  <g><circle cx="90" cy="140" r="26" fill="#e8e2d6"/><text x="90" y="145">猫</text></g>
  <g><circle cx="230" cy="140" r="26" fill="#e8e2d6"/><text x="230" y="145">が</text></g>
  <g><circle cx="370" cy="140" r="26" fill="#e8e2d6"/><text x="370" y="145">魚を</text></g>
  <g><circle cx="510" cy="140" r="26" fill="#e8e2d6"/><text x="510" y="145">見て</text></g>
  <g><circle cx="650" cy="140" r="26" fill="#e8e2d6"/><text x="650" y="145">それを</text></g>
</g>
<g stroke="#b85c2a" stroke-width="2.5" marker-end="url(#b)">
  <line x1="118" y1="140" x2="200" y2="140"/><line x1="258" y1="140" x2="340" y2="140"/><line x1="398" y1="140" x2="480" y2="140"/><line x1="538" y1="140" x2="620" y2="140"/>
</g>
<text x="650" y="190" text-anchor="middle" font-size="13" fill="#9a4a2a">「それ」= 猫? 魚?　最初を忘れている</text>
<!-- Transformer -->
<text x="40" y="240" font-size="16" font-weight="700" fill="#3b6ea5">今（トランスフォーマー）: 全員が同じ会議室。誰でも誰にでも直接聞ける</text>
<g stroke="#3b6ea5" stroke-width="1.5" opacity="0.5">
  <line x1="150" y1="330" x2="300" y2="300"/><line x1="150" y1="330" x2="450" y2="300"/><line x1="150" y1="330" x2="600" y2="330"/><line x1="150" y1="330" x2="300" y2="400"/><line x1="150" y1="330" x2="450" y2="400"/>
  <line x1="300" y1="300" x2="450" y2="300"/><line x1="300" y1="300" x2="600" y2="330"/><line x1="300" y1="300" x2="300" y2="400"/><line x1="300" y1="300" x2="450" y2="400"/>
  <line x1="450" y1="300" x2="600" y2="330"/><line x1="450" y1="300" x2="300" y2="400"/><line x1="450" y1="300" x2="450" y2="400"/>
  <line x1="600" y1="330" x2="300" y2="400"/><line x1="600" y1="330" x2="450" y2="400"/><line x1="300" y1="400" x2="450" y2="400"/>
</g>
<line x1="600" y1="330" x2="150" y2="330" stroke="#b85c2a" stroke-width="4"/>
<g font-size="14" fill="#2b2b2b" text-anchor="middle">
  <g><circle cx="150" cy="330" r="26" fill="#dbe6f3" stroke="#3b6ea5" stroke-width="2"/><text x="150" y="335">猫</text></g>
  <g><circle cx="300" cy="300" r="26" fill="#dbe6f3" stroke="#3b6ea5" stroke-width="2"/><text x="300" y="305">が</text></g>
  <g><circle cx="450" cy="300" r="26" fill="#dbe6f3" stroke="#3b6ea5" stroke-width="2"/><text x="450" y="305">魚を</text></g>
  <g><circle cx="300" cy="400" r="26" fill="#dbe6f3" stroke="#3b6ea5" stroke-width="2"/><text x="300" y="405">見て</text></g>
  <g><circle cx="450" cy="400" r="26" fill="#dbe6f3" stroke="#3b6ea5" stroke-width="2"/><text x="450" y="405">食べた</text></g>
  <g><circle cx="600" cy="330" r="26" fill="#f3e3d6" stroke="#b85c2a" stroke-width="3"/><text x="600" y="335">それを</text></g>
</g>
<text x="690" y="300" font-size="13" fill="#b85c2a" font-weight="700">太い線 = 注目</text>
<text x="690" y="320" font-size="13" fill="#b85c2a">（アテンション）</text>
<text x="690" y="350" font-size="13" fill="#555">「それ」は「魚」</text>
<text x="690" y="370" font-size="13" fill="#555">と直接つなぐ</text>
<text x="400" y="445" text-anchor="middle" font-size="13" fill="#9a9a9a">2017 Google "Attention Is All You Need"　／　同時に見るから並列計算 = GPU と相性がよい = 巨大化できた</text>
</svg>
