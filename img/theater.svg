<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic UI, sans-serif" font-size="15">
<rect width="800" height="480" rx="14" fill="#fbf8f2"/>
<text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#2b2b2b">意識の劇場（グローバルワークスペース説）</text>
<!-- stage -->
<rect x="200" y="70" width="400" height="120" rx="6" fill="#2b2b2b"/>
<polygon points="400,60 290,190 510,190" fill="#f5d98a" opacity="0.55"/>
<circle cx="400" cy="62" r="10" fill="#f5d98a"/>
<text x="400" y="200" text-anchor="middle" font-size="12" fill="#555">スポットライトは 1 本。照らされたものだけが「意識に上る」</text>
<g font-size="13" text-anchor="middle" fill="#2b2b2b">
  <rect x="320" y="135" width="60" height="30" rx="6" fill="#fff"/><text x="350" y="155">りんご</text>
  <rect x="390" y="135" width="60" height="30" rx="6" fill="#fff"/><text x="420" y="155">赤い</text>
  <rect x="460" y="135" width="60" height="30" rx="6" fill="#fff"/><text x="490" y="155">食べたい</text>
</g>
<text x="620" y="110" font-size="13" fill="#b85c2a" font-weight="700">狭い:</text>
<text x="620" y="130" font-size="13" fill="#555">人間 4〜7 個</text>
<text x="620" y="150" font-size="13" fill="#555">Jスペース 数十個</text>
<!-- broadcast arrows -->
<g stroke="#b85c2a" stroke-width="2" opacity="0.7">
  <line x1="400" y1="195" x2="120" y2="290"/><line x1="400" y1="195" x2="260" y2="300"/><line x1="400" y1="195" x2="400" y2="305"/><line x1="400" y1="195" x2="540" y2="300"/><line x1="400" y1="195" x2="680" y2="290"/>
</g>
<text x="400" y="240" text-anchor="middle" font-size="13" fill="#b85c2a" font-weight="700">一斉放送 → だから言葉にも記憶にも行動にも使える</text>
<!-- audience -->
<g font-size="12" text-anchor="middle" fill="#fff">
  <g><circle cx="120" cy="320" r="26" fill="#3b6ea5"/><text x="120" y="324">視覚係</text></g>
  <g><circle cx="260" cy="330" r="26" fill="#3b6ea5"/><text x="260" y="334">聴覚係</text></g>
  <g><circle cx="400" cy="335" r="26" fill="#3b6ea5"/><text x="400" y="339">記憶係</text></g>
  <g><circle cx="540" cy="330" r="26" fill="#3b6ea5"/><text x="540" y="334">言語係</text></g>
  <g><circle cx="680" cy="320" r="26" fill="#3b6ea5"/><text x="680" y="324">感情係</text></g>
</g>
<g fill="#9fb3cc">
  <circle cx="80" cy="380" r="8"/><circle cx="110" cy="390" r="8"/><circle cx="140" cy="380" r="8"/><circle cx="170" cy="392" r="8"/><circle cx="200" cy="380" r="8"/><circle cx="230" cy="392" r="8"/><circle cx="260" cy="382" r="8"/><circle cx="290" cy="392" r="8"/><circle cx="320" cy="380" r="8"/><circle cx="350" cy="392" r="8"/><circle cx="380" cy="382" r="8"/><circle cx="410" cy="392" r="8"/><circle cx="440" cy="380" r="8"/><circle cx="470" cy="392" r="8"/><circle cx="500" cy="382" r="8"/><circle cx="530" cy="392" r="8"/><circle cx="560" cy="380" r="8"/><circle cx="590" cy="392" r="8"/><circle cx="620" cy="382" r="8"/><circle cx="650" cy="392" r="8"/><circle cx="680" cy="380" r="8"/><circle cx="710" cy="392" r="8"/>
  <circle cx="95" cy="410" r="8"/><circle cx="125" cy="420" r="8"/><circle cx="155" cy="410" r="8"/><circle cx="185" cy="420" r="8"/><circle cx="215" cy="410" r="8"/><circle cx="245" cy="420" r="8"/><circle cx="275" cy="410" r="8"/><circle cx="305" cy="420" r="8"/><circle cx="335" cy="410" r="8"/><circle cx="365" cy="420" r="8"/><circle cx="395" cy="410" r="8"/><circle cx="425" cy="420" r="8"/><circle cx="455" cy="410" r="8"/><circle cx="485" cy="420" r="8"/><circle cx="515" cy="410" r="8"/><circle cx="545" cy="420" r="8"/><circle cx="575" cy="410" r="8"/><circle cx="605" cy="420" r="8"/><circle cx="635" cy="410" r="8"/><circle cx="665" cy="420" r="8"/><circle cx="695" cy="410" r="8"/>
</g>
<text x="400" y="448" text-anchor="middle" font-size="13" fill="#555">客席 = 何千もの無意識の専門家（モジュール）。並列で働くが、舞台に上がれるのは一度に 1 つ</text>
<text x="400" y="468" text-anchor="middle" font-size="12" fill="#9a9a9a">バーズ 1988 → ドゥアンヌ　／　2026-07 Anthropic: Claude の中に同じ「舞台」（Jスペース）が勝手にできていた</text>
</svg>
