<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic UI, sans-serif" font-size="15">
<rect width="800" height="440" rx="14" fill="#fbf8f2"/>
<text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#2b2b2b">J-lens: 数字の羅列に「単語のレンズ」をかざす</text>
<defs><marker id="e" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/></marker>
<clipPath id="lens"><circle cx="400" cy="200" r="70"/></clipPath></defs>
<!-- numbers block -->
<rect x="40" y="90" width="260" height="220" rx="10" fill="#2b2b2b"/>
<text x="170" y="80" text-anchor="middle" font-size="14" fill="#555">AI の中身（活性値）: 人間には読めない</text>
<g font-family="Consolas, monospace" font-size="12" fill="#8a8a8a">
  <text x="52" y="115">0.23 -1.07 0.88 0.02 -0.41 1.93</text>
  <text x="52" y="135">-0.66 0.11 2.04 -1.38 0.57 0.09</text>
  <text x="52" y="155">1.12 0.44 -0.93 0.71 -2.20 0.36</text>
  <text x="52" y="175">0.05 -0.78 1.46 0.19 0.83 -1.11</text>
  <text x="52" y="195">-1.52 0.62 0.27 -0.34 1.08 0.90</text>
  <text x="52" y="215">0.77 -0.15 -1.64 1.29 0.41 -0.58</text>
  <text x="52" y="235">0.33 1.71 -0.22 0.96 -1.05 0.14</text>
  <text x="52" y="255">-0.89 0.48 1.17 -0.73 0.26 1.55</text>
  <text x="52" y="275">1.02 -0.37 0.65 0.18 -1.26 0.84</text>
  <text x="52" y="295">0.59 0.92 -1.48 1.36 0.07 -0.61</text>
</g>
<text x="170" y="335" text-anchor="middle" font-size="13" fill="#555">数千億のパラメーター × 層ごとの数万の数字</text>
<!-- lens -->
<circle cx="400" cy="200" r="70" fill="#f5d98a" opacity="0.25" stroke="#b85c2a" stroke-width="4"/>
<line x1="450" y1="250" x2="500" y2="300" stroke="#b85c2a" stroke-width="8" stroke-linecap="round"/>
<text x="400" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#b85c2a">単語ごとの</text>
<text x="400" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#b85c2a">「指紋」で照らす</text>
<text x="400" y="110" text-anchor="middle" font-size="12" fill="#555">「この数字の並びは、どの単語を</text>
<text x="400" y="126" text-anchor="middle" font-size="12" fill="#555">言いやすくしているか」を逆算</text>
<g stroke="#9a9a9a" stroke-width="2" marker-end="url(#e)"><line x1="305" y1="200" x2="325" y2="200"/><line x1="475" y1="200" x2="520" y2="200"/></g>
<!-- words -->
<rect x="530" y="90" width="240" height="220" rx="10" fill="#fff" stroke="#e0d8c8"/>
<text x="650" y="80" text-anchor="middle" font-size="14" fill="#555">Jスペース: いま頭にある数十語</text>
<g font-size="14" text-anchor="middle">
  <rect x="545" y="105" width="90" height="28" rx="14" fill="#dbe6f3"/><text x="590" y="124" fill="#2b2b2b">counting</text>
  <rect x="645" y="105" width="110" height="28" rx="14" fill="#f3e3d6" stroke="#b85c2a" stroke-width="2"/><text x="700" y="124" fill="#b85c2a" font-weight="700">consciousness</text>
  <rect x="545" y="145" width="60" height="28" rx="14" fill="#dbe6f3"/><text x="575" y="164" fill="#2b2b2b">five</text>
  <rect x="615" y="145" width="70" height="28" rx="14" fill="#dbe6f3"/><text x="650" y="164" fill="#2b2b2b">spider</text>
  <rect x="695" y="145" width="60" height="28" rx="14" fill="#dbe6f3"/><text x="725" y="164" fill="#2b2b2b">legs</text>
  <rect x="545" y="185" width="60" height="28" rx="14" fill="#f3e3d6" stroke="#b85c2a" stroke-width="2"/><text x="575" y="204" fill="#b85c2a" font-weight="700">fake</text>
  <rect x="615" y="185" width="90" height="28" rx="14" fill="#f3e3d6" stroke="#b85c2a" stroke-width="2"/><text x="660" y="204" fill="#b85c2a" font-weight="700">secretly</text>
  <rect x="545" y="225" width="130" height="28" rx="14" fill="#f3e3d6" stroke="#b85c2a" stroke-width="2"/><text x="610" y="244" fill="#b85c2a" font-weight="700">manipulation</text>
  <rect x="685" y="225" width="70" height="28" rx="14" fill="#dbe6f3"/><text x="720" y="244" fill="#2b2b2b">France</text>
  <text x="650" y="285" fill="#555" font-size="12">言っていなくても「頭にある」ことが読める</text>
</g>
<text x="400" y="375" text-anchor="middle" font-size="13" fill="#555">書き換えると答えが変わる（クモ→アリで 8 本→6 本）。消すと「手は動くのに自覚が消える」</text>
<text x="400" y="400" text-anchor="middle" font-size="13" fill="#555">だから「相関」ではなく「因果」。ここで研究者は「これはグローバルワークスペースそのものでは」と気づく</text>
<text x="400" y="425" text-anchor="middle" font-size="12" fill="#9a9a9a">Anthropic 2026-07-06 "A global workspace in language models"</text>
</svg>
