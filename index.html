<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カーツワイル 動画ノート</title>
<meta name="description" content="レイ・カーツワイルの名言集・生い立ち・意識とAI。YouTube台本のための読み物。">
<style>
:root{
  --bg:#f7f5f0; --fg:#1e1e1e; --muted:#6b6b6b; --line:#dcd8cf; --accent:#8a4b1f; --card:#ffffff; --th:#efebe3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#15161a; --fg:#e8e6e1; --muted:#9a9a9a; --line:#33353b; --accent:#e0a36a; --card:#1d1f24; --th:#24262c; }
}
:root[data-theme="dark"]{ --bg:#15161a; --fg:#e8e6e1; --muted:#9a9a9a; --line:#33353b; --accent:#e0a36a; --card:#1d1f24; --th:#24262c; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;font-size:17px;line-height:1.85;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.bar{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.bar a{white-space:nowrap;padding:6px 12px;border:1px solid var(--line);border-radius:6px;color:var(--fg);text-decoration:none;font-size:14px}
.bar a.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
main{max-width:820px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:1.5rem;line-height:1.4;margin:1.2em 0 .6em}
h2{font-size:1.25rem;margin:2em 0 .6em;padding-bottom:.3em;border-bottom:2px solid var(--line)}
h3{font-size:1.05rem;margin:1.6em 0 .5em;color:var(--accent)}
p,li{word-break:break-word}
a{color:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:2em 0}
blockquote{margin:1em 0;padding:.6em 1em;border-left:3px solid var(--accent);background:var(--card);color:var(--muted)}
code{font-size:.9em;background:var(--th);padding:.1em .35em;border-radius:4px}
.tw{overflow-x:auto;margin:1em -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.92rem;line-height:1.6;background:var(--card)}
th,td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
th{background:var(--th);font-weight:600}
td:nth-child(1){white-space:nowrap}
.note{color:var(--muted);font-size:.85rem}
img{max-width:100%;height:auto;display:block;margin:1.2em auto;border-radius:10px}
.loading{color:var(--muted);padding:40px 0;text-align:center}
</style>
</head>
<body>
<header><nav class="bar" id="nav"></nav></header>
<main id="main"><div class="loading">読み込み中…</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const pages = [
  {id:"policy", file:"00_方針.md",            label:"方針"},
  {id:"quotes", file:"01_名言集と生い立ち.md", label:"名言集・生い立ち"},
  {id:"mind",   file:"02_意識とAI.md",       label:"意識とAI"},
  {id:"tech",   file:"03_AIの仕組みと背後の巨人.md", label:"AIの仕組み・巨人"},
];
const nav = document.getElementById("nav");
const main = document.getElementById("main");
pages.forEach(p=>{
  const a=document.createElement("a"); a.href="#"+p.id; a.textContent=p.label; a.id="nav-"+p.id; nav.appendChild(a);
});
async function show(){
  const id=(location.hash||"#policy").slice(1);
  const p=pages.find(x=>x.id===id)||pages[0];
  document.querySelectorAll(".bar a").forEach(a=>a.classList.toggle("on",a.id==="nav-"+p.id));
  main.innerHTML='<div class="loading">読み込み中…</div>';
  try{
    const r=await fetch(encodeURI(p.file)+"?v="+Date.now());
    if(!r.ok) throw new Error(r.status);
    const md=await r.text();
    main.innerHTML=marked.parse(md,{gfm:true,breaks:false});
    main.querySelectorAll("table").forEach(t=>{const w=document.createElement("div");w.className="tw";t.parentNode.insertBefore(w,t);w.appendChild(t);});
    main.querySelectorAll("a[href^=http]").forEach(a=>{a.target="_blank";a.rel="noopener";});
    window.scrollTo(0,0);
  }catch(e){
    main.innerHTML='<p class="loading">読み込めませんでした（'+e.message+'）。少し待って再読み込みしてください。</p>';
  }
}
addEventListener("hashchange",show); show();
</script>
</body>
</html>
